# 故障：进程立刻非 0 退出 → CrashLoopBackOff
apiVersion: v1
kind: Pod
metadata:
  name: demo-crashloop
  labels:
    app: demo
    fault: crashloop
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'ERROR: Config file /etc/app/config.yaml not found'; exit 1"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
