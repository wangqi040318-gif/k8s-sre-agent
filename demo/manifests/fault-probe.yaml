# 故障：nginx 监听 80 且只提供 /，探针却访问 :8080/healthz
# Pod 会 Running 但 not Ready；存活探针失败后重启。镜像需能拉取。
apiVersion: v1
kind: Pod
metadata:
  name: demo-probe
  labels:
    app: demo
    fault: probe
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - name: http
          containerPort: 80
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 5
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 5
        failureThreshold: 3
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
